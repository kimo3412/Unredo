name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go vet -tags=integration ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, suffix: "" }
          - { goos: linux, goarch: arm64, suffix: "" }
          - { goos: windows, goarch: amd64, suffix: .exe }
          - { goos: darwin, goarch: amd64, suffix: "" }
          - { goos: darwin, goarch: arm64, suffix: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o "unredo${{ matrix.suffix }}" ./cmd/unredo

  mysql-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Start MySQL 8.4
        run: |
          docker run -d --name unredo-mysql -e MYSQL_ROOT_PASSWORD=123456 -p 3306:3306 mysql:8.4 \
            --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --binlog-row-image=FULL \
            --binlog-row-metadata=FULL --gtid-mode=ON --enforce-gtid-consistency=ON
          for attempt in $(seq 1 60); do
            if docker exec unredo-mysql mysqladmin ping -h127.0.0.1 -uroot -p123456 --silent; then exit 0; fi
            sleep 2
          done
          docker logs unredo-mysql
          exit 1
      - name: Initialize fixtures
        run: |
          docker exec -i unredo-mysql mysql -uroot -p123456 < scripts/setup_test_users.sql
          docker exec -i unredo-mysql mysql -uroot -p123456 < scripts/init_m0_schema.sql
          docker exec -i unredo-mysql mysql -uroot -p123456 < scripts/seed_fixtures.sql
      - name: Run integration suite
        run: |
          go build -o bin/unredo.exe ./cmd/unredo
          go test -tags=integration -count=1 -timeout 300s ./tests/integration
